# Production stack for Dokploy (Docker Compose). Secrets come from Dokploy's environment settings.
#
#   browser -> [Dokploy / Traefik] -> web:3000 --(/api/v1/* rewrite)--> api:8000 -> postgres:5432
#
# Only `web` is routed publicly (add the domain to the `web` service, port 3000, in Dokploy).
# `api` and `postgres` are reachable on the internal network only.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peopleforce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-peopleforce}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs once per deployment and exits. It is the only process that applies migrations.
  migrate:
    build: ./api
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: &api_env
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-peopleforce}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-peopleforce}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL, e.g. https://peopleforce.site}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-PeopleForce <onboarding@resend.dev>}
      CONTENT_SOURCE: ${CONTENT_SOURCE:-local}
      SANITY_PROJECT_ID: ${SANITY_PROJECT_ID:-}
      SANITY_DATASET: ${SANITY_DATASET:-production}
      SANITY_TOKEN: ${SANITY_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://eu.i.posthog.com}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./api
    restart: unless-stopped
    environment: *api_env
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      args:
        API_INTERNAL_URL: http://api:8000
        NEXT_PUBLIC_POSTHOG_KEY: ${POSTHOG_API_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${POSTHOG_HOST:-https://eu.i.posthog.com}
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  # Named volume: survives rebuilds and redeploys. Never run `docker compose down -v` in production.
  postgres_data:
