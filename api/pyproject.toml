[project]
name = "peopleforce"
version = "0.1.0"
description = "PeopleForce API"
requires-python = ">=3.13"
dependencies = [
    "adaptix>=3.0.0b12",
    "alembic>=1.20.1",
    "anthropic>=2.8.0",
    "asyncpg>=0.32.0",
    "dishka>=1.10.1",
    "email-validator>=2.4.0",
    "fastapi>=0.163.0",
    "google-genai>=3.3.0",
    "httpx>=0.28.1",
    "langfuse>=5.2.0",
    "posthog>=7.91.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2",
    "structlog>=26.1.0",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
