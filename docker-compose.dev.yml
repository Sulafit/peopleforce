# Local development: only PostgreSQL runs in Docker; the API and web app run on the host.
#   docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: peopleforce
      POSTGRES_PASSWORD: peopleforce
      POSTGRES_DB: peopleforce
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - peopleforce_dev_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peopleforce -d peopleforce"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  peopleforce_dev_pg:
